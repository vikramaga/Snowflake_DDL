name: IndiaWeeklyReversal2xAboveSMA50

on:
  schedule:
    - cron: '30 0 * * *'   # 00:30 UTC = 06:00 IST, daily
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-sma-retest
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install --upgrade yfinance pandas numpy requests tqdm matplotlib

      - name: Run scanner
        env:
          GMAIL_USER: ${{ secrets.EMAIL_FROM }}
          GMAIL_PASS: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO:   ${{ secrets.EMAIL_TO }}
        run: python india_weekly_reversal_2x_above_sma50_v1.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: india-weekly-reversal-2x-above-sma50-results-${{ github.run_id }}
          path: |
            india_weekly_reversal_2x_above_sma50_*.csv
            india_weekly_reversal_2x_above_sma50_chart_*.png
            tv_india_weekly_reversal_2x_above_sma50_*.txt
          retention-days: 30
