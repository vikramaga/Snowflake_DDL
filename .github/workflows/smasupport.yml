name: smasupport
on:
  
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-sma50-compression
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install --upgrade yfinance pandas numpy requests tqdm matplotlib

      - name: Run scanner
        env:
          GMAIL_USER: ${{ secrets.EMAIL_FROM }}
          GMAIL_PASS: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO:   ${{ secrets.EMAIL_TO }}
        run: python smasupport.py

      - name: Upload results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bull-stack-shakeout-${{ github.run_id }}
          path: |
            bull_stack_shakeout_*.csv
            bull_stack_shakeout_chart_*.png
            tv_bull_stack_shakeout_*.txt
          retention-days: 30

         