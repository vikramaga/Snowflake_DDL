name: basebreakout
on:
  
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy yfinance tqdm

      - name: Run SMA50 support history scanner
        env:
          GMAIL_USER: ${{ secrets.EMAIL_FROM }}
          GMAIL_PASS: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python basebreakouth4.py

      - name: Upload CSV as workflow artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: base-breakout-h4-${{ github.run_id }}
          path: |
            base_breakout_h4_jma_*.csv
            base_breakout_chart_*.png
            tv_base_breakout_h4_*.txt
          retention-days: 30