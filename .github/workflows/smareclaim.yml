name: SMA50 Compression + Bullish Reclaim Scanner

on:
  
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-sma50-compression
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install --upgrade yfinance pandas numpy requests tqdm matplotlib

      - name: Run scanner
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          EMAIL_TO:   ${{ secrets.EMAIL_TO }}
        run: python smareclaim.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sma50-compression-results-${{ github.run_id }}
          path: |
            sma50_compression_reclaim_*.csv
            sma50_compression_chart_*.png
            tv_sma50_compression_*.txt
          retention-days: 30