name: SMA50 Support History Scanner

on:
  
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy yfinance tqdm

      - name: Run SMA50 support history scanner
        env:
          GMAIL_USER: ${{ secrets.EMAIL_FROM }}
          GMAIL_APP_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          GMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python SMA50bt.py

      - name: Upload CSV as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sma50-support-history-csv
          path: sma50_support_history_*.csv
          retention-days: 30