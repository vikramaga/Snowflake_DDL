name: allmacross
on:

  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy yfinance tqdm

      - name: Run SMA50 support history scanner
        env:
          GMAIL_USER: ${{ secrets.EMAIL_FROM }}
          GMAIL_PASS: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python allmacross.py

      - name: Upload CSV as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ma-comp-macd-rsi-${{ github.run_id }}
          path: |
            ma_comp_macd_rsi_*.csv
            ma_comp_macd_rsi_chart_*.png
            tv_ma_comp_macd_rsi_*.txt
          retention-days: 30