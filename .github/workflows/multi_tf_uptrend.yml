name: MultiTFUptrend

on:
  
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-sma-retest
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install --upgrade yfinance pandas numpy requests tqdm matplotlib

      - name: Run scanner
        env:
          GMAIL_USER: ${{ secrets.EMAIL_FROM }}
          GMAIL_PASS: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO:   ${{ secrets.EMAIL_TO }}
        run: python multi_tf_uptrend_v1.py

      - name: Upload results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: multi-tf-uptrend-results-${{ github.run_id }}
          path: |
            multi_tf_uptrend_*.csv
            multi_tf_uptrend_chart_*.png
            tv_multi_tf_uptrend_*.txt
          retention-days: 30
