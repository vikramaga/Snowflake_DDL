# RSI Digest — runs automatically when the scheduled (06:00 IST) ClaudeRunner
# run finishes. Filters that run's screener CSVs to RSI 58–64 and
# Total_Amount < $550, emails the list with the CSV attached, and saves the
# CSV to claude_run/results/digest/<date>/.
# Change the filter with the RSI_MIN / RSI_MAX / MAX_AMOUNT values below.

name: RSI Digest

on:
  workflow_run:
    workflows: [ClaudeRunner]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (latest master, includes the run's committed results)
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --upgrade yfinance pandas numpy

      - name: Filter and email
        env:
          RESULTS_RUN:    ${{ github.event.workflow_run.id }}
          RSI_MIN:        "58"
          RSI_MAX:        "64"
          MAX_AMOUNT:     "550"
          GMAIL_USER:     ${{ secrets.EMAIL_FROM }}
          GMAIL_PASS:     ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO:       ${{ secrets.EMAIL_TO }}
        run: python claude_run/tools/rsi_amount_filter.py --email | tee rsi_digest.log

      - name: Save CSV to repo
        run: bash claude_run/tools/save_digest.sh