name: fundvery
on:
  
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-sma50-compression
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install --upgrade yfinance pandas numpy requests tqdm matplotlib

      - name: Run scanner
        env:
          GMAIL_USER: ${{ secrets.EMAIL_FROM }}
          GMAIL_PASS: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO:   ${{ secrets.EMAIL_TO }}
        run: python veryfund.py

      -name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strong-fund-sma-support-${{ github.run_id }}
          path: |
            strong_fund_sma_support_*.csv
            strong_fund_sma_chart_*.png
            tv_strong_fund_support_*.txt
          retention-days: 30

         