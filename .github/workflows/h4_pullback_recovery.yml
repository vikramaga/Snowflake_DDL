name: H4 Pullback Recovery Scanner

on:
  schedule:
    - cron: "50 22 * * 1-5"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-h4-pullback
          restore-keys: ${{ runner.os }}-pip-
      - name: Install
        run: pip install --upgrade yfinance pandas numpy requests tqdm matplotlib
      - name: Run
        env:
          GMAIL_USER: ${{ secrets.EMAIL_FROM }}
          GMAIL_PASS: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO:   ${{ secrets.EMAIL_TO }}
        run: python nasdaq_h4_pullback_recovery.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: h4-pullback-${{ github.run_id }}
          path: |
            h4_pullback_recovery_*.csv
            h4_pullback_chart_*.png
            tv_h4_pullback_*.txt
          retention-days: 30
